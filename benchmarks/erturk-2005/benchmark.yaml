# Benchmark: Erturk et al. (2005)
# "Numerical Solutions of 2-D Steady Incompressible Driven Cavity Flow at High Reynolds Numbers"
# International Journal for Numerical Methods in Fluids, 48(7), 747-774

citation: "Erturk, E., Corke, T.C. and Gokcol, C. (2005)"
doi: "10.1002/fld.953"
problem: "Lid-driven cavity at high Reynolds numbers"
type: incompressible
regime: laminar-to-transitional

parameters:
  reynolds_numbers: [1000, 2500, 5000, 7500, 10000, 12500, 15000, 17500, 20000, 21000]
  mesh: "601x601 uniform grid"
  method: "Stream function-vorticity formulation"

validation_data:
  # Primary vortex center location for various Re
  primary_vortex:
    description: "Primary vortex center (x, y) and stream function"
    columns: [Re, x_center, y_center, psi_min]
    data:
      - [1000,   0.5313, 0.5625, -0.1189]
      - [2500,   0.5188, 0.5438, -0.1222]
      - [5000,   0.5156, 0.5356, -0.1227]
      - [7500,   0.5125, 0.5313, -0.1228]
      - [10000,  0.5125, 0.5300, -0.1228]
      - [12500,  0.5094, 0.5281, -0.1228]
      - [15000,  0.5094, 0.5275, -0.1228]
      - [20000,  0.5063, 0.5250, -0.1228]
      - [21000,  0.5063, 0.5250, -0.1228]

acceptance_criteria:
  max_relative_error: 0.03
  note: "High-Re cases (>10000) require fine meshes and extended run times"
